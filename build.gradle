
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.ALL
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include generated client and server resources.
    srcDir('src/generated/client')
    srcDir('src/generated/server')

    // Exclude development-only resources.
    exclude('**/*.bbmodel')
    exclude('**/.cache/**')
}

repositories {
    //    maven { url = 'https://maven.minecraftforge.net/' }
    //    maven {
    //        // location of the maven that hosts JEI files since January 2023
    //        name = "Jared's maven"
    //        url = "https://maven.blamejared.com/"
    //    }
    //    maven {
    //        // location of a maven mirror for JEI files, as a fallback
    //        name = "ModMaven"
    //        url = "https://modmaven.dev"
    //    }
}

base {
    archivesName = mod_id
}

// Minecraft 26.1 uses Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    // accessTransformers = project.files(
    //     'src/main/resources/META-INF/accesstransformer.cfg'
    // )

    runs {
        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()

            programArgument '--nogui'

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Generate client assets only.
        clientData {
            clientData()

            programArguments.addAll(
                    '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/client').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
            )
        }

        // Generate server data only.
        serverData {
            serverData()

            programArguments.addAll(
                    '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/server').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
            )
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Run both client and server data generation.
tasks.register('runDataAll') {
    group = 'data generation'
    description = 'Generates both client and server resources.'

    dependsOn tasks.named('runClientData')
    dependsOn tasks.named('runServerData')
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Add mod dependencies here.
}

var generateModMetadata = tasks.register(
        'generateModMetadata',
        ProcessResources
) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]

    inputs.properties replaceProperties
    expand replaceProperties

    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata

neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }

    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
